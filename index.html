<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Escola de Programação</title>
</head>

<body> 

    <h1>Inscrição para Curso de Programação</h1>
    <p>Preencha o formulário abaixo para realizar sua inscrição.</p>

    <form action="#" method="post">

        <!-- Dados pessoais -->
        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Digite seu nome" required>
                   <br><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome"
                   placeholder="Digite seu sobrenome" required>
                   <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email"
                   placeholder="exemplo@email.com" required>
                   <br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Mínimo de 8 caracteres"
                   minlength="8" required>
            <br><br>

             <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone"
                   placeholder="(00) 00000-0000" required>
            <br><br>

             <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade"
                   min="14" max="100" required>
            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>
      
        </fieldset>

        <br>

        <!-- Informações do curso -->
        <fieldset>
            <legend>Informações do curso</legend>

            <p>Escolha um curso:</p>

            <input type="radio" id="htmlcss" name="curso" value="HTML e CSS" required>
            <label for="htmlcss">HTML e CSS</label><br>

            <input type="radio" id="javascript" name="curso" value="JavaScript">
            <label for="javascript">JavaScript</label><br>

            <input type="radio" id="python" name="curso" value="Python">
            <label for="python">Python</label><br>

            <input type="radio" id="java" name="curso" value="Java">
            <label for="java">Java</label><br>

            <input type="radio" id="bancodados" name="curso" value="Banco de Dados">
            <label for="bancodados">Banco de Dados</label>

            <br><br>

             </fieldset>

        <br>

         <!-- Conhecimentos -->
        <fieldset>
            <legend>Conhecimentos</legend>

             <label for="nivel">Nível de conhecimento:</label>
            <select id="nivel" name="nivel" required>
                <option value="">Selecione seu nível</option>
                <option value="iniciante">Iniciante</option>
                <option value="intermediario">Intermediário</option>
                <option value="avancado">Avançado</option>
            </select>
              </fieldset>

        <br>

 <!-- Tecnologias conhecidas -->
        <fieldset>
            <legend>Tecnologias</legend>
            <p>Quais tecnologias você já conhece?</p>

            <input type="checkbox" id="tec-html" name="tecnologias" value="HTML">
            <label for="tec-html">HTML</label><br>

            <input type="checkbox" id="tec-css" name="tecnologias" value="CSS">
            <label for="tec-css">CSS</label><br>

            <input type="checkbox" id="tec-js" name="tecnologias" value="JavaScript">
            <label for="tec-js">JavaScript</label><br>

            <input type="checkbox" id="tec-python" name="tecnologias" value="Python">
            <label for="tec-python">Python</label><br>

            <input type="checkbox" id="tec-java" name="tecnologias" value="Java">
            <label for="tec-java">Java</label><br>

            <input type="checkbox" id="tec-csharp" name="tecnologias" value="C#">
            <label for="tec-csharp">C#</label>

        </fieldset>

        <br>

        <!-- Localização -->
        <fieldset>
            <legend>Localização</legend>

            <label for="estado">Estado:</label>
            <select id="estado" name="estado" required>
                <option value="">Selecione seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="MG">Minas Gerais</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
            </select>

            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade"
                   placeholder="Digite sua cidade"
                   minlength="3" required>

            
                   </fieldset>

        <br>

        <!-- Informações adicionais -->
        <fieldset>
            <legend>Informações adicionais</legend>

            <label for="motivo">
                Por que você deseja fazer este curso?
            </label>
            <br><br>

            <textarea id="motivo" name="motivo"
                      placeholder="Digite o motivo da sua inscrição..."
                      rows="6"
                      minlength="20"
                      maxlength="500"
                      required></textarea>

            <br><br>

             <input type="checkbox" id="termos" name="termos"
                   value="aceito" required>
            <label for="termos">Aceito os termos de inscrição</label>

        </fieldset>

        <br>

        <!-- Botões -->
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>

    </form>

</body>
</html>
